# DNY-AIGC — build dari sumber (entrypoint default): api & web dari checkout lokal;
# gateway dari checkout sibling `../dramaclaw-gateway` (atau override lewat env).
#   git clone <gateway-repo> ../dramaclaw-gateway
#   cp .env.example .env && docker compose up -d --build
# Definisi runtime (env / port / volume / healthcheck) di-extends dari
# docker-compose.release.yml; file ini hanya menambah build + nama image lokal.
# Hanya pull image rilis: docker compose -f docker-compose.release.yml up -d
# Sumber gateway default: ../dramaclaw-gateway. Path lain / URL git:
#   .env set DNY_AIGC_GATEWAY_SRC=<path> atau URL git#ref
# Image lokal memakai prefiks dny-aigc-local/* agar tidak menimpa cache image rilis.
services:
  api:
    extends:
      file: docker-compose.release.yml
      service: api
    image: dny-aigc-local/api
    build:
      context: .
      dockerfile: Dockerfile
      # Default: image ringkas. Fitur 3DGS/SHARP «world»:
      #   INSTALL_WORLD=1 docker compose up -d --build
      args:
        INSTALL_WORLD: "${INSTALL_WORLD:-0}"
  newapi:
    extends:
      file: docker-compose.release.yml
      service: newapi
    image: dny-aigc-local/gateway
    build:
      context: ${DNY_AIGC_GATEWAY_SRC:-${DRAMACLAW_GATEWAY_SRC:-../dramaclaw-gateway}}
      dockerfile: Dockerfile
  web:
    extends:
      file: docker-compose.release.yml
      service: web
    image: dny-aigc-local/web
    build:
      context: ./frontend
      dockerfile: Dockerfile

# extends tidak membawa top-level volumes; nyatakan ulang di sini.
volumes:
  ce-data:
  newapi-data:

# DNY-AIGC — build dari sumber (entrypoint default): api & web dari checkout lokal;
# gateway dari checkout sibling `../gateway` (atau override lewat env).
#   git clone <gateway-repo> ../gateway
#   cp .env.example .env && docker compose up -d --build
# Definisi runtime di-extends dari docker-compose.release.yml.
# Hanya pull image rilis: docker compose -f docker-compose.release.yml up -d
# Override sumber gateway: .env → DNY_AIGC_GATEWAY_SRC=<path|url>
# Image lokal: dny-aigc-local/*
services:
  api:
    extends:
      file: docker-compose.release.yml
      service: api
    image: dny-aigc-local/api
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_WORLD: "${INSTALL_WORLD:-0}"
  newapi:
    extends:
      file: docker-compose.release.yml
      service: newapi
    image: dny-aigc-local/gateway
    build:
      # Prefer DNY_AIGC_GATEWAY_SRC; fall back to legacy env / sibling folders.
      # ../gateway (disarankan) atau ../dramaclaw-gateway (checkout lama) bila junction belum ada.
      context: ${DNY_AIGC_GATEWAY_SRC:-${DRAMACLAW_GATEWAY_SRC:-../gateway}}
      dockerfile: Dockerfile
  web:
    extends:
      file: docker-compose.release.yml
      service: web
    image: dny-aigc-local/web
    build:
      context: ./frontend
      dockerfile: Dockerfile

volumes:
  ce-data:
  newapi-data:
